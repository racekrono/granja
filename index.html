<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Granja</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 16px;
      border-radius: 4px;
    }
    button:disabled {
      background-color: #ccc;
    }
    .status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Registro de Dados da Granja</h2>
  
  <form id="formGranja">
    <div class="form-group">
      <label for="titulo">Descrição / Lote:</label>
      <input type="text" id="titulo" placeholder="Ex: Lote 01 - Galinhas Poedeiras" required>
    </div>

    <div class="form-group">
      <label for="quantidade">Quantidade:</label>
      <input type="number" id="quantidade" placeholder="Ex: 50" required>
    </div>

    <div class="form-group">
      <label for="observacoes">Observações:</label>
      <textarea id="observacoes" rows="3" placeholder="Detalhes adicionais..."></textarea>
    </div>

    <button type="submit" id="btnSalvar">Salvar Dados</button>
  </form>

  <div id="statusMsg" class="status"></div>

  <!-- Script Firebase via CDN usando type="module" -->
  <script type="module">
    // 1. Importações do SDK Modular do Firebase 10
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 2. Sua Configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDD-6ZugbKVmSfmF76iBrXqmOD7ZAYyo24",
      authDomain: "granja-5d0b8.firebaseapp.com",
      databaseURL: "https://granja-5d0b8-default-rtdb.firebaseio.com",
      projectId: "granja-5d0b8",
      storageBucket: "granja-5d0b8.firebasestorage.app",
      messagingSenderId: "140023118643",
      appId: "1:140023118643:web:29b41055a6d3a6fd58dc46"
    };

    // 3. Inicializa o App e o Realtime Database
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Captura dos elementos do formulário
    const form = document.getElementById("formGranja");
    const btnSalvar = document.getElementById("btnSalvar");
    const statusMsg = document.getElementById("statusMsg");

    // 4. Evento de Envio/Clique do Formulário
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      btnSalvar.disabled = true;
      statusMsg.style.color = "black";
      statusMsg.innerText = "Salvando...";

      // Monta o objeto com os dados digitados
      const dados = {
        titulo: document.getElementById("titulo").value,
        quantidade: Number(document.getElementById("quantidade").value),
        observacoes: document.getElementById("observacoes").value,
        criadoEm: new Date().toISOString()
      };

      // PASSO A: Grava imediatamente no LocalStorage
      localStorage.setItem("ultimo_registro_granja", JSON.stringify(dados));

      // PASSO B: Envia para o Firebase Realtime Database
      try {
        const registrosRef = ref(db, "registros");
        const novoRegistroRef = push(registrosRef);
        await set(novoRegistroRef, dados);

        statusMsg.style.color = "green";
        statusMsg.innerText = "✓ Salvo com sucesso no Firebase e no LocalStorage!";
        form.reset();
      } catch (error) {
        console.error("Erro ao salvar no Firebase:", error);
        statusMsg.style.color = "orange";
        statusMsg.innerText = "⚠️ Erro na conexão com o banco! O dado ficou salvo localmente.";
      } finally {
        btnSalvar.disabled = false;
      }
    });
  </script>
</body>
</html>
